# yamllint disable rule:indentation
---
# pin the Node used by node-language hooks (stylelint); verified with pre-commit 4.6.2 + npm 11.20.0 ( stylelint 18 requires node ^22.22.2 || ^24.15.0 || >=26 )
default_language_version:
  node: 26.12.1

# `pre-commit install` installs BOTH git hooks (so the commit-msg check activates without --hook-type)
default_install_hook_types: [pre-commit, commit-msg]
# scope every hook to the pre-commit stage by default; hooks that opt into another stage (e.g. Typos on commit-msg) override this, so unrestricted hooks no longer re-run at commit-msg
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        name: End Of File Fixer
      - id: check-yaml
        name: Check YAML
        args: ["--unsafe"]
      - id: check-json
        name: Check JSON
      - id: check-merge-conflict
        name: Check Merge Conflict
      - id: check-case-conflict
        name: Check Case Conflict
      - id: mixed-line-ending
        name: Mixed Line Ending
        args: ["--fix=lf"]

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-crlf
        name: Forbid CRLF Line Endings
      - id: remove-crlf
        name: Remove CRLF Line Endings
      - id: remove-tabs
        name: Remove Tabs (2 spaces)
        args: [--whitespaces-count, '2']

  - repo: https://github.com/thibaudcolas/pre-commit-stylelint
    rev: v17.16.0
    hooks:
      - id: stylelint
        name: Stylelint
        additional_dependencies:
          - 'stylelint@17.16.0'
        args: ['--fix']
        files: '\.css$'

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      # scan file contents (auto-fixes in place)
      - id: typos
        name: Typos
        args: ['--write-changes', '--force-exclude']
      # scan the commit message itself; no --write-changes -> only fail, never rewrite the message
      - id: typos
        name: Typos (commit message)
        alias: typos-commit-msg
        stages: [commit-msg]
        args: ['--force-exclude']
