[files]
ignore-hidden = true
ignore-files = true
ignore-dot = true
ignore-vcs = true
ignore-global = true
ignore-parent = true
extend-exclude = []

[default]
binary = false
check-filename = true
check-file = true
unicode=true
locale = "en"
# skip git SHA in changelog commit links, e.g. [3ba4ebe](https://.../commit/3ba4ebedc06...)
extend-ignore-re = ['\[[0-9a-f]{7,40}\]\(https?://[^)]*/commit/[0-9a-f]{7,40}\)']

[default.extend-words]
# <typo> = "<correction>"
Ue = "Ue"
